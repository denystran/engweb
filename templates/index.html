<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Trắc nghiệm Tiếng Anh 4 - Bảo mật</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">
    <div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-lg">
        <h1 class="text-3xl font-extrabold text-gray-800 mb-2 text-center">Đề Thi Trắc Nghiệm Tiếng Anh 4</h1>
        <p class="text-center text-gray-500 mb-8">Mã đề: 0003 - HCMUT (Bảo mật đáp án phía Server)</p>
        
        <form id="quizForm" class="space-y-6">
            {% for q_id, q in questions.items() %}
            <div class="p-5 border border-gray-200 rounded-xl bg-gray-50 question-block" data-id="{{ q_id }}">
                <p class="font-semibold text-gray-800 mb-3">Câu {{ q_id }}: {{ q.question }}</p>
                <div class="space-y-2">
                    {% for opt_key, opt_val in q.options.items() %}
                    <label class="flex items-center space-x-3 p-2 rounded-lg hover:bg-white cursor-pointer transition">
                        <input type="radio" name="q_{{ q_id }}" value="{{ opt_key }}" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                        <span class="text-gray-700"><strong>{{ opt_key }}.</strong> {{ opt_val }}</span>
                    </label>
                    {% endfor %}
                </div>
                <!-- Vùng phản hồi kết quả và giải thích -->
                <div class="feedback mt-3 text-sm hidden p-3 rounded-lg"></div>
            </div>
            {% endfor %}
            
            <button type="button" onclick="submitQuiz()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition shadow-md">
                Nộp bài & Xem kết quả
            </button>
        </form>

        <div id="scoreContainer" class="mt-8 text-center text-2xl font-bold text-gray-800 hidden p-4 bg-blue-50 rounded-xl border border-blue-200"></div>
    </div>

    <script>
        async function submitQuiz() {
            const answers = {};
            const blocks = document.querySelectorAll('.question-block');
            
            blocks.forEach(block => {
                const qId = block.getAttribute('data-id');
                const selected = block.querySelector(`input[name="q_${qId}"]:checked`);
                if (selected) {
                    answers[qId] = selected.value;
                }
            });

            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answers })
                });
                
                const data = await response.json();

                // Hiển thị tổng điểm
                const scoreContainer = document.getElementById('scoreContainer');
                scoreContainer.innerText = `Điểm số của bạn: ${data.score} / ${data.total}`;
                scoreContainer.classList.remove('hidden');

                // Hiển thị đáp án đúng/sai và lời giải cho từng câu
                for (const [qId, res] of Object.entries(data.results)) {
                    const block = document.querySelector(`.question-block[data-id="${qId}"]`);
                    const feedback = block.querySelector('.feedback');
                    feedback.classList.remove('hidden');
                    
                    if (res.is_correct) {
                        feedback.className = "feedback mt-3 text-sm p-3 rounded-lg bg-green-100 text-green-800 border border-green-200";
                        feedback.innerHTML = `<span class="font-semibold">✔ Chính xác!</span>`;
                    } else {
                        feedback.className = "feedback mt-3 text-sm p-3 rounded-lg bg-red-100 text-red-800 border border-red-200";
                        feedback.innerHTML = `<span class="font-semibold">✘ Sai rồi. Đáp án đúng là: ${res.correct}</span><p class="mt-1 text-gray-700"><strong>Giải thích:</strong> ${res.explanation}</p>`;
                    }
                }
                
                // Cuộn trang lên đầu để xem điểm
                scoreContainer.scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                alert("Đã xảy ra lỗi khi nộp bài. Vui lòng thử lại!");
                console.error(error);
            }
        }
    </script>
</body>
</html>
